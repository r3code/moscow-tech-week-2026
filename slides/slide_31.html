<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Slide 20 — CASE 4 · Что может пойти не так в пятницу...</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="global.css">
<style>
  body { display:flex; align-items:center; justify-content:center; min-height:100vh; }
  .slide-container { display:flex; flex-direction:column; }
  .top-header { padding:40px 70px 16px 70px; display:flex; align-items:center; gap:22px; position:relative; z-index:10; }
  .accent-bar-h { width:6px; height:70px; background:#EF5350; border-radius:3px; flex-shrink:0; }
  .title-en-h { font-family:'PT Serif',serif; font-style:italic; font-weight:700; font-size:20px; color:#C62828; letter-spacing:2px; text-transform:uppercase; margin-bottom:6px; line-height:1; }
  .title-cn-h { font-family:'Montserrat',sans-serif; font-weight:900; font-size:38px; color:#212121; line-height:1.1; margin:0; }
  .case-decor { position:absolute; top:18px; right:140px; font-family:'Montserrat',sans-serif; font-weight:900; font-size:80px; color:#FFEBEE; opacity:0.6; z-index:1; line-height:1; pointer-events:none; }
  .content { flex:1; padding:20px 70px 40px 70px; display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative; z-index:10; }
  .image-card { max-width:480px; max-height:460px; border-radius:16px; overflow:hidden; box-shadow:0 15px 40px rgba(0,0,0,0.15); border:4px solid #FFFFFF; }
  .image-card img { width:100%; height:460px; object-fit:cover; display:block; }
  .caption { margin-top:20px; text-align:center; font-family:'PT Serif',serif; font-style:italic; font-size:22px; color:#616161; }
  .grid-pattern { position:absolute; inset:0; background-image: linear-gradient(rgba(239,83,80,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(239,83,80,0.04) 1px, transparent 1px); background-size:40px 40px; z-index:0; pointer-events:none; }
  .deco-circle { position:absolute; border-radius:50%; pointer-events:none; z-index:0; }
</style>
</head>
<body>
<div class="slide-container">
  <div class="grid-pattern"></div>
  <div class="deco-circle" data-decor aria-hidden="true" style="width:300px;height:300px;background:rgba(239,83,80,0.05);top:-100px;right:-90px;"></div>
  <div class="deco-circle" data-decor aria-hidden="true" style="width:200px;height:200px;background:rgba(255,167,38,0.06);bottom:-60px;left:-60px;"></div>

  <div class="case-decor" data-decor aria-hidden="true">CASE 4</div>

  <div class="page-badge">
    <span class="badge-num">31 / 51</span>
    <span class="badge-bar"></span>
  </div>

  <header class="top-header">
    <div class="accent-bar-h"></div>
    <div>
      <div class="title-en-h">CASE 4 · ВСТУПЛЕНИЕ</div>
      <h1 class="title-cn-h">Что может пойти не так в пятницу...</h1>
    </div>
  </header>

  <main class="content">
    <div class="image-card">
      <img src="rake.jpg" alt="Грабли">
    </div>
    <div class="caption">Грабли, на которые мы наступили в пятницу</div>
  </main>

  <aside data-notes>Перед следующим кейсом — небольшая пауза. Этот слайд — вступление. Пятница, конец недели, и мы решили, что всё хорошо. Как выяснилось — зря. Дальше — история одного пятничного паника.</aside>
</div>
</body>
</html>
