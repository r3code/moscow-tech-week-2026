<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Slide 02 — Обо мне</title>
<link rel="stylesheet" href="global.css">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
<div class="slide-container" style="background:#FFFFFF;flex-direction:row;">

  <!-- Page badge -->
  <div class="page-badge" style="z-index:40;">
    <span class="badge-num">02 / 51</span>
    <span class="badge-bar"></span>
  </div>

  <!-- LEFT — Photo pane 35% -->
  <div style="width:35%;height:100%;position:relative;overflow:hidden;">
    <img src="dima-talks-photo.jpg" alt="Дмитрий Синявский"
         style="width:100%;height:100%;object-fit:cover;display:block;">
    <!-- gradient overlay -->
    <div data-decor aria-hidden="true"
         style="position:absolute;inset:0;background:linear-gradient(transparent 60%, rgba(0,0,0,0.55));"></div>
    <!-- caption -->
    <div style="position:absolute;bottom:24px;left:24px;color:#FFFFFF;font-family:'PT Serif',serif;font-style:italic;font-size:21px;">
      Дмитрий Синявский
    </div>
  </div>

  <!-- RIGHT — Content pane 65% -->
  <div style="width:65%;height:100%;padding:70px 70px 70px 50px;display:flex;flex-direction:column;justify-content:center;background:#FFFFFF;position:relative;">

    <!-- Title block -->
    <div style="display:flex;align-items:center;gap:22px;margin-bottom:36px;">
      <div style="width:6px;height:80px;background:#42A5F5;border-radius:3px;"></div>
      <div>
        <div style="font-family:'Montserrat',sans-serif;font-weight:900;font-size:52px;color:#212121;line-height:1.05;">
          Обо мне
        </div>
      </div>
    </div>

    <!-- 2x2 stat grid -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">

      <!-- Card 1 -->
      <div style="background:#F8F9FA;border-radius:14px;padding:28px 24px;border-left:5px solid #42A5F5;display:flex;flex-direction:column;align-items:center;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,0.04);">
        <div style="display:flex;align-items:center;gap:8px;">
          <div style="font-family:'Montserrat',sans-serif;font-weight:900;font-size:56px;color:#1565C0;line-height:1;">20+</div>
          <i class="fas fa-bolt" style="font-size:32px;color:#BF360C;"></i>
        </div>
        <div style="font-family:'Inter',sans-serif;font-size:21px;color:#616161;margin-top:8px;">лет в IT</div>
      </div>

      <!-- Card 2 -->
      <div style="background:#F8F9FA;border-radius:14px;padding:28px 24px;border-left:5px solid #4DB6AC;display:flex;flex-direction:column;align-items:center;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,0.04);">
        <div style="font-family:'Montserrat',sans-serif;font-weight:900;font-size:56px;color:#00796B;line-height:1;">6+</div>
        <div style="font-family:'Inter',sans-serif;font-size:21px;color:#616161;margin-top:8px;">лет руководства разработкой</div>
      </div>

      <!-- Card 3 -->
      <div style="background:#F8F9FA;border-radius:14px;padding:28px 24px;border-left:5px solid #5C6BC0;display:flex;flex-direction:column;align-items:center;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,0.04);">
        <div style="font-family:'Montserrat',sans-serif;font-weight:900;font-size:56px;color:#5C6BC0;line-height:1;">5+</div>
        <div style="font-family:'Inter',sans-serif;font-size:21px;color:#616161;margin-top:8px;">лет в backend-разработке</div>
      </div>

      <!-- Card 4 -->
      <div style="background:#F8F9FA;border-radius:14px;padding:28px 24px;border-left:5px solid #AB47BC;display:flex;flex-direction:column;align-items:center;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,0.04);">
        <div style="font-family:'Montserrat',sans-serif;font-weight:900;font-size:56px;color:#AB47BC;line-height:1;">5+</div>
        <div style="font-family:'Inter',sans-serif;font-size:21px;color:#616161;margin-top:8px;">лет в SRE</div>
      </div>

    </div>

  </div>

  <aside data-notes class="hidden">Кратко обо мне. 20+ лет в IT — начинал backend-разработчиком, потом 6 лет руководил разработкой, последние 5 лет работаю SRE. Отвечаю за наблюдаемость — логи, метрики, трейсы.</aside>
</div>

</html>
