name: Lint deck

# Проверка инвариантов миграции на каждом PR и при пуше в deck/.
# Локально: npm --prefix deck run lint

on:
  push:
    branches: [main, master]
    paths:
      - 'deck/slides.md'
      - 'deck/pages/**'
      - 'deck/scripts/lint-slides.mjs'
      - '.github/workflows/lint.yml'
  pull_request:
    paths:
      - 'deck/slides.md'
      - 'deck/pages/**'
      - 'deck/scripts/lint-slides.mjs'
      - '.github/workflows/lint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Migration invariants
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deck
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: deck/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint
