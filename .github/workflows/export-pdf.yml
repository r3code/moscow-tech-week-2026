name: Export PDF

# Автоматический экспорт колоды в PDF (каждое v-click состояние = страница)
# при КАЖДОМ пуше в main — параллельно с деплоем на Pages.
# PDF публикуется как GitHub Release с тегом `latest` — всегда один,
# заменяет предыдущий. Скачивание:
#   https://github.com/r3code/moscow-tech-week-2026/releases/latest

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-pdf:
    name: Export slides to PDF
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deck
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: deck/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        # Lint before sed injection — checks __VERSION__ placeholder presence.
        run: npm run lint

      - name: Generate version string
        run: |
          VERSION="$(date -u +%Y%m%d) rev. $(echo ${{ github.sha }} | cut -c1-7)"
          echo "Version: $VERSION"
          sed -i "s/__VERSION__/$VERSION/g" slides.md pages/*.md
          grep -rq "$VERSION" pages/ && echo "Version injected OK"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Install Chromium for Playwright
        # --with-deps тянет системные libs (libnss3, libatk, ...).
        # Без них chromium падает с непонятной ошибкой.
        run: npx playwright install --with-deps chromium

      - name: Export slides to PDF
        # --with-clicks — каждое v-click состояние = отдельная страница
        # --wait-until networkidle — ждать все картинки
        # --wait 1500 — пауза 1.5с после networkidle для надёжности
        run: npx slidev export --format pdf --with-clicks --wait-until networkidle --wait 1500 --output dist/mtw2026.pdf --timeout 180000

      - name: Show PDF info
        run: ls -la dist/mtw2026.pdf

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: mtw2026-pdf
          path: deck/dist/mtw2026.pdf
          if-no-files-found: error
          retention-days: 30

      - name: Delete previous latest release
        # Удаляем старый релиз `latest` + тег, чтобы всегда был только один PDF.
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || echo "No previous latest release — creating first"

      - name: Create latest release with PDF
        # Публикуем PDF как asset в релизе `latest`.
        # Тег `latest` указывает на текущий HEAD.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create latest dist/mtw2026.pdf \
            --title "PDF Export — $VERSION" \
            --notes "Автоматическая сборка из commit ${{ github.sha }}
          - Версия: $VERSION
          - Дата: $(date -u +%Y-%m-%d)

          Скачайте **mtw2026.pdf** из Assets ниже." \
            --latest
